<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            max-width: 700px;
            margin: auto;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .table {
            margin-top: 1rem;
        }
        .badge {
            font-size: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
        .badge-aprobado {
            background-color: #28a745;
            color: white;
        }
        .badge-condicional {
            background-color: #ffc107;
            color: black;
        }
        .badge-rechazado {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <h2 class="mb-4">Resultados de Evaluación</h2>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Resultado</th>
                    </tr>
                </thead>
                <tbody>
                    {% for cliente in clientes %}
                    <tr>
                        <td>{{ cliente.nombre }}</td>
                        <td>
                            {% if cliente.evaluacion == 'Aprobado' %}
                                <span class="badge badge-aprobado">Aprobado</span>
                            {% elif cliente.evaluacion == 'Aprobado Condicional' %}
                                <span class="badge badge-condicional">Aprobado con Condición</span>
                            {% else %}
                                <span class="badge badge-rechazado">Rechazado</span>
                            {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            <div class="text-center mt-3">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Volver</a>
            </div>
        </div>
    </div>
</body>
</html>
