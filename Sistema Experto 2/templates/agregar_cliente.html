<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            max-width: 500px;
            margin: auto;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .form-control, .form-select {
            border-radius: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #007bff, #0056b3);
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #0056b3, #003580);
        }
        .btn-secondary {
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <h2 class="text-center mb-4">Agregar Cliente</h2>
            <form action="{{ url_for('agregar_cliente') }}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Historial Crediticio</label>
                    <input type="number" name="historialCrediticio" class="form-control" required>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="noHistorialCheck" oninput="noHistorial()">
                    <label class="form-check-label" for="noHistorialCheck">No tengo historial crediticio</label>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ingresos Mensuales</label>
                    <input type="number" id="salario" name="salario" class="form-control" required oninput="calcularDatos()">
                </div>
                <div class="mb-3">
                    <label class="form-label">Préstamo</label>
                    <input type="number" id="prestamo" name="prestamo" class="form-control" required min="1" step="0.01" oninput="calcularDatos()">
                </div>
                <div class="mb-3">
                    <label class="form-label">Plazo en meses</label>
                    <input type="number" id="plazo" class="form-control" value="1" required oninput="calcularDatos()">
                </div>
                <div class="mb-3">
                    <label class="form-label">Veces mayor a la cuota</label>
                    <input type="number" id="ingresosMensuales" name="ingresosMensuales" class="form-control" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">Relación Deuda/Ingreso (%)</label>
                    <input type="number" id="deudaIngreso" name="deudaIngreso" class="form-control" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tipo de Empleo</label>
                    <select name="tipoEmpleo" id="tipoEmpleo" class="form-select">
                        <option value="contratoFijoMayor5">Contrato fijo mayor 5 años</option>
                        <option value="contratoFijoMenor5">Contrato fijo menor a 5 años</option>
                        <option value="autonomo">Autónomo</option>
                        <option value="temporal">Temporal</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Garantías Presentadas</label>
                    <select name="garantias" class="form-select">
                        <option value="avalAltoValor">Aval alto valor</option>
                        <option value="avalBajoValor">Aval bajo valor</option>
                        <option value="sinGarantias">Sin garantías</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Historial de Préstamos</label>
                    <select name="historialPrestamo" class="form-select">
                        <option value="sinRetraso">Sin retrasos</option>
                        <option value="retrasoOcasional">Retrasos ocasionales</option>
                        <option value="impagos">Impagos/mora</option>
                        <option value="noHistorial">Sin Historial</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Agregar Cliente</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('index') }}" class="btn btn-secondary w-100">Volver</a>
            </div>
        </div>
    </div>
    <script>
        function calcularDatos() {
            let salario = parseFloat(document.getElementById("salario").value);
            let prestamo = parseFloat(document.getElementById("prestamo").value);
            let plazo = parseInt(document.getElementById("plazo").value);
            if (salario > 0 && prestamo > 0 && plazo > 0) {
                let pagoMensual = prestamo / plazo;
                let vecesCuota = salario / pagoMensual;
                let relacionDeudaIngreso = (pagoMensual / salario) * 100;
                document.getElementById("ingresosMensuales").value = vecesCuota.toFixed(2);
                document.getElementById("deudaIngreso").value = relacionDeudaIngreso.toFixed(2);
            } else {
                document.getElementById("ingresosMensuales").value = "";
                document.getElementById("deudaIngreso").value = "";
            }
        }
        function noHistorial() {
            let checkbox = document.getElementById("noHistorialCheck");
            let historialPrestamo = document.querySelector("select[name='historialPrestamo']");
            if (checkbox.checked) {
                historialPrestamo.value = "noHistorial";
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
