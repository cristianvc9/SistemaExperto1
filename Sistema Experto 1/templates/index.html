<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; text-align: center; background-color: #f8f9fa; }
        h1 { color: #007bff; }
        .container { max-width: 600px; margin: auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); }
        .button-container { margin-bottom: 20px; }
        .button { display: inline-block; padding: 10px 15px; margin: 5px; color: white; background-color: #007bff; text-decoration: none; border-radius: 5px; transition: 0.3s; }
        .button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gestión de Clientes</h1>
        
        <div class="button-container">
            <a href="{{ url_for('agregar_cliente') }}" class="button">Agregar Cliente</a>
            <a href="{{ url_for('evaluar_riesgo') }}" class="button">Evaluar Riesgo</a>
        </div>

        <h2>Lista de Clientes</h2>
        {% if clientes %}
        <table>
            <tr>
                <th>Nombre</th>
            </tr>
            {% for cliente in clientes %}
            <tr>
                <td>{{ cliente['nombre'] }}</td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
        <p>No hay clientes registrados.</p>
        {% endif %}
    </div>

</body>
</html>
