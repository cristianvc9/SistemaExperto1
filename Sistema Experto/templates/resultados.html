<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de Evaluación de Riesgo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; text-align: center; }
        table { width: 80%; margin: 20px auto; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        a { display: block; margin-top: 20px; text-decoration: none; color: #007bff; font-weight: bold; }
        a:hover { color: #0056b3; }
    </style>
</head>
<body>
    <h1>Resultados de Evaluación de Riesgo</h1>
    <table>
        <tr>
            <th>Nombre</th>
            <th>Puntaje de Riesgo</th>
            <th>Nivel de Riesgo</th>
        </tr>
        {% for resultado in resultados %}
        <tr>
            <td>{{ resultado['nombre'] }}</td>
            <td>{{ resultado['puntaje_riesgo'] }}/100</td>
            <td>{{ resultado['nivel_riesgo'] }}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="{{ url_for('index') }}">Volver a la lista de clientes</a>
</body>
</html>
